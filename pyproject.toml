[project]
name = "softlab-py-goodies"
version = "0.1.0"
description = "A collection of small Python utility scripts."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
dev = [
    "basedpyright>=1.31.4",
    "pre-commit>=4.3.0",
    "pytest>=8.4.1",
    "ruff>=0.12.8",
    "vulture>=2.14",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "SIM",
    "UP",
]
ignore = [
    "E501",
]

[tool.basedpyright]
include = [
    "scripts",
    "tests",
]
stubPath = "typings"
pythonVersion = "3.14"
typeCheckingMode = "basic"
reportMissingModuleSource = false

[tool.vulture]
min_confidence = 100
paths = [
    "scripts",
    "tests",
]
exclude = [
    ".git",
    ".idea",
    ".venv",
    "typings",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
